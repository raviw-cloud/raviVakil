<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VakilDesk — Contract review for Indian advocates</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  ::selection{background:#1a1410;color:#faf6ef}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(800%)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.34,1.4,.64,1)}
  .reveal.in{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Locked to Editorial Ink — the other 3 design variants from the mockup were stripped.
const EDITORIAL = {
  name: "Editorial Ink",
  bg: "#f5efe2", surface: "#faf6ef", ink: "#1a1410", body: "#3d342c", muted: "#7a6b5d",
  accent: "#c1272d", amber: "#b8722e", moss: "#3f6b3f", border: "#e7ddc9",
  display: "'Newsreader', serif", body_font: "'DM Sans', sans-serif", mono: "'JetBrains Mono', monospace",
  swatch: ["#f5efe2","#1a1410","#c1272d","#b8722e"]
};
// Map all variant keys to Editorial Ink so any `p === VARIANTS.brutalist`-style checks still resolve falsy.
const VARIANTS = { editorial: EDITORIAL };

function Logo({ p, size = 28 }) {
  const isBrut = p === VARIANTS.brutalist;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 9, textDecoration: "none" }}>
      <div style={{ width: size, height: size, background: p.ink, color: p.surface, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: isBrut ? 0 : 6, fontFamily: p.display, fontWeight: 600, fontStyle: isBrut ? "normal" : "italic", fontSize: size * 0.64 }}>V</div>
      <div style={{ fontFamily: p.display, fontSize: size * 0.68, fontWeight: isBrut ? 700 : 500, color: p.ink, letterSpacing: isBrut ? "-.03em" : "-.01em", textTransform: isBrut ? "uppercase" : "none" }}>VakilDesk</div>
    </div>
  );
}

function LiveRiskCard({ p }) {
  const [step, setStep] = useState(0);
  const [score, setScore] = useState(0);
  const items = [
    { n: "Security Deposit Refund", l: "Cl. 4.2", sev: "HIGH", col: p.accent },
    { n: "Eviction Notice — 15 days", l: "Cl. 7.1", sev: "HIGH", col: p.accent },
    { n: "Forum: New Delhi (property in Mumbai)", l: "Cl. 12", sev: "HIGH", col: p.accent },
    { n: "Annual Escalation 10%", l: "Cl. 4.1", sev: "MED", col: p.amber },
    { n: "Stamp Duty Split", l: "Cl. 14", sev: "LOW", col: p.moss },
  ];
  useEffect(() => {
    let t = []; t.push(setTimeout(() => setStep(1), 400));
    items.forEach((_, i) => t.push(setTimeout(() => setStep(2 + i), 900 + i * 350)));
    t.push(setTimeout(() => {
      let s = 0;
      const iv = setInterval(() => {
        s += 2; setScore(Math.min(s, 62));
        if (s >= 62) clearInterval(iv);
      }, 24);
    }, 900 + items.length * 350 + 200));
    return () => t.forEach(clearTimeout);
  }, []);
  const isBrut = p === VARIANTS.brutalist;
  return (
    <div style={{ position: "relative", background: p.surface, border: `${isBrut ? 2 : 1}px solid ${p.border}`, borderRadius: isBrut ? 0 : 14, padding: "22px 26px", boxShadow: isBrut ? "6px 6px 0 " + p.ink : `0 20px 50px ${p.ink}11`, fontFamily: p.body_font, overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, paddingBottom: 14, borderBottom: `1px solid ${p.border}` }}>
        <div>
          <div style={{ fontFamily: p.mono, fontSize: 10, color: p.muted, letterSpacing: ".12em", textTransform: "uppercase" }}>Live · Analyzing</div>
          <div style={{ fontFamily: p.display, fontSize: 17, color: p.ink, fontWeight: 500, marginTop: 2 }}>Mehta-Patel_LeaveLicense.pdf</div>
        </div>
        <div style={{ position: "relative", width: 54, height: 54 }}>
          <svg width="54" height="54" style={{ transform: "rotate(-90deg)" }}>
            <circle cx="27" cy="27" r="22" fill="none" stroke={p.border} strokeWidth="4" />
            <circle cx="27" cy="27" r="22" fill="none" stroke={score < 50 ? p.accent : p.amber} strokeWidth="4" strokeLinecap="round" strokeDasharray={`${(score / 100) * 138} 138`} style={{ transition: "stroke-dasharray .3s" }} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: p.display, fontSize: 20, fontWeight: 500, color: p.ink }}>{score}</div>
        </div>
      </div>
      <div style={{ position: "relative", minHeight: 200 }}>
        {step >= 1 && step < 2 && (
          <div style={{ position: "absolute", left: 0, right: 0, height: 2, background: `linear-gradient(90deg,transparent,${p.accent},transparent)`, animation: "scan 2s linear infinite", pointerEvents: "none" }} />
        )}
        {items.map((it, i) => {
          const visible = step >= 2 + i;
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 0", borderBottom: i < items.length - 1 ? `1px solid ${p.border}` : "none", opacity: visible ? 1 : 0, transform: visible ? "translateX(0)" : "translateX(-10px)", transition: "all .35s cubic-bezier(.34,1.4,.64,1)" }}>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: it.col, flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, color: p.ink, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.n}</div>
                <div style={{ fontFamily: p.mono, fontSize: 10, color: p.muted, letterSpacing: ".05em" }}>{it.l}</div>
              </div>
              <div style={{ fontFamily: p.mono, fontSize: 9, fontWeight: 700, color: it.col, letterSpacing: ".1em", padding: "3px 7px", border: `1px solid ${it.col}`, borderRadius: isBrut ? 0 : 100 }}>{it.sev}</div>
            </div>
          );
        })}
      </div>
      {step >= 2 + items.length && (
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${p.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", animation: "fadeUp .5s ease" }}>
          <div style={{ fontFamily: p.mono, fontSize: 10, color: p.muted, letterSpacing: ".1em", textTransform: "uppercase" }}>Recommendation</div>
          <div style={{ fontFamily: p.display, fontSize: 14, color: p.accent, fontWeight: 600, fontStyle: isBrut ? "normal" : "italic" }}>Negotiate Before Signing</div>
        </div>
      )}
    </div>
  );
}

function Hero({ p, showDemo }) {

  const isLed = p === VARIANTS.ledger;
  return (
    <section style={{ padding: "72px 32px 80px", background: p.bg, position: "relative", overflow: "hidden" }}>
      {isLed && <div style={{ position: "absolute", inset: 0, backgroundImage: `repeating-linear-gradient(0deg,transparent,transparent 31px,${p.border} 31px,${p.border} 32px)`, opacity: .4, pointerEvents: "none" }} />}

          </div>
          <h1 style={{ fontFamily: p.display, fontSize: isBrut ? "clamp(48px,8vw,108px)" : "clamp(40px,6.5vw,84px)", fontWeight: isBrut ? 700 : 400, lineHeight: isBrut ? .95 : 1.02, letterSpacing: isBrut ? "-.04em" : "-.025em", color: p.ink, margin: "0 0 24px", textTransform: isBrut ? "uppercase" : "none" }}>
            Read every clause. <i style={{ color: p.muted, fontWeight: isBrut ? 700 : 300, fontStyle: isBrut ? "normal" : "italic" }}>{isBrut ? "DON'T" : "Don't"}</i> read for {isBrut ? <span style={{ color: p.accent }}>four hours.</span> : <span style={{ color: p.accent, fontStyle: "italic" }}>four hours.</span>}
          </h1>
          <p style={{ fontFamily: isBrut ? p.body_font : p.display, fontSize: 19, lineHeight: 1.55, color: p.body, margin: "0 0 32px", maxWidth: 560, fontWeight: 400 }}>
            VakilDesk reads any Indian contract — leave &amp; license, NDA, service, employment — and returns risks scored against ICA 1872, redline language, and a negotiation script. In about <b style={{ color: p.ink }}>five minutes</b>.
          </p>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 18 }}>
            <a href="login.html" style={{ background: p.ink, color: p.surface, padding: "14px 26px", borderRadius: isBrut ? 0 : 100, textDecoration: "none", fontWeight: 600, fontSize: 15, fontFamily: p.body_font, display: "inline-flex", alignItems: "center", gap: 8, border: isBrut ? `2px solid ${p.ink}` : "none", boxShadow: isBrut ? "4px 4px 0 " + p.accent : "none", transition: "transform .15s" }} onMouseEnter={e => e.currentTarget.style.transform = "translate(-2px,-2px)"} onMouseLeave={e => e.currentTarget.style.transform = "translate(0,0)"}>
              Start free trial <span>→</span>
            </a>
            <a href="#how" style={{ background: "transparent", color: p.ink, padding: "14px 26px", borderRadius: isBrut ? 0 : 100, textDecoration: "none", fontWeight: 500, fontSize: 15, fontFamily: p.body_font, border: `${isBrut ? 2 : 1.5}px solid ${p.ink}` }}>

          </div>
          <div style={{ fontFamily: p.mono, fontSize: 11, color: p.muted, letterSpacing: ".06em" }}>No credit card · 7 days free · Cancel anytime</div>
        </div>
        {showDemo && (
          <div className="reveal in" style={{ transform: isBrut ? "rotate(1deg)" : "none" }}>
            <LiveRiskCard p={p} />
          </div>
        )}
      </div>
    </section>
  );
}

function Marquee({ p, on }) {
  const items = ["ICA 1872", "DPDP Act 2023", "Specific Relief Act 1963", "BNS 2023", "Maharashtra Rent Control", "MSMED 2006", "IT Act 2000", "Arbitration & Conciliation 1996", "Companies Act 2013", "Sale of Goods Act 1930"];
  const isBrut = p === VARIANTS.brutalist;
  return (
    <div style={{ background: p.ink, color: p.surface, padding: "18px 0", overflow: "hidden", borderTop: `1px solid ${p.ink}`, borderBottom: `1px solid ${p.ink}` }}>
      <div style={{ display: "flex", gap: 48, whiteSpace: "nowrap", animation: on ? "marquee 38s linear infinite" : "none", willChange: "transform" }}>
        {[...items, ...items, ...items].map((s, i) => (
          <div key={i} style={{ fontFamily: isBrut ? p.body_font : p.display, fontSize: isBrut ? 22 : 24, fontWeight: isBrut ? 700 : 400, fontStyle: isBrut ? "normal" : "italic", letterSpacing: isBrut ? ".02em" : "-.01em", textTransform: isBrut ? "uppercase" : "none", display: "flex", alignItems: "center", gap: 48 }}>
            {s}<span style={{ color: p.amber }}>✦</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Counter({ to }) {
  const [n, setN] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        const start = performance.now();
        const tick = (t) => {
          const p = Math.min(1, (t - start) / 1400);
          const ease = 1 - Math.pow(1 - p, 3);
          setN(to * ease);
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        obs.disconnect();
      }
    }, { threshold: .3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [to]);
  return <span ref={ref}>{Number.isInteger(to) ? Math.round(n) : n.toFixed(1)}</span>;
}

function Stats({ p }) {
  const data = [
    { k: "Hours saved per review", v: 3.7, suffix: "h" },
    { k: "Median analysis time", v: 4.8, suffix: " min" },
    { k: "Indian statutes covered", v: 24, suffix: "+" },
    { k: "Clause types recognised", v: 180, suffix: "" },
  ];
  const isBrut = p === VARIANTS.brutalist;
  return (
    <section className="reveal" style={{ padding: "56px 32px", background: p.bg, borderBottom: `1px solid ${p.border}` }}>
      <div style={{ maxWidth: 1240, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 40 }}>
        {data.map((d, i) => (
          <div key={i}>
            <div style={{ fontFamily: p.display, fontSize: isBrut ? 64 : 54, fontWeight: isBrut ? 700 : 500, color: p.ink, lineHeight: .9, letterSpacing: "-.03em" }}>
              <Counter to={d.v} /><span style={{ color: p.accent }}>{d.suffix}</span>
            </div>
            <div style={{ fontFamily: p.mono, fontSize: 11, color: p.muted, letterSpacing: ".1em", textTransform: "uppercase", marginTop: 10, fontWeight: 600 }}>{d.k}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function FAQ({ p }) {
  const items = [
    { q: "How accurate is the risk analysis?", a: "VakilDesk catches 95%+ of common Indian-law risks across ICA 1872, DPDP Act 2023, IT Act 2000, BNS 2023, and Specific Relief Act 1963. Trained on Indian contracts and case law." },
    { q: "What contract types does it handle?", a: "Leave & license, employment agreements, NDAs, partnership deeds, licensing, lease deeds, service contracts, freelancer agreements. Specialised for Indian courts." },
    { q: "Is my data secure?", a: "Contracts deleted immediately after analysis. We do not train on your documents. Fully DPDP Act 2023 compliant." },
    { q: "Can I get an API?", a: "Yes — for law firms and legal-tech platforms. Email support@vakildesk.in." },
  ];
  const [open, setOpen] = useState(0);
  const isBrut = p === VARIANTS.brutalist;
  return (
    <section className="reveal" style={{ padding: "96px 32px", background: p.bg }}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <div style={{ fontFamily: p.mono, fontSize: 11, letterSpacing: ".15em", textTransform: "uppercase", color: p.muted, fontWeight: 600, marginBottom: 14 }}>Common Questions</div>
          <h2 style={{ fontFamily: p.display, fontSize: "clamp(32px,4vw,48px)", fontWeight: isBrut ? 700 : 400, lineHeight: 1.05, letterSpacing: "-.025em", color: p.ink, margin: 0, textTransform: isBrut ? "uppercase" : "none" }}>Asked &amp; answered.</h2>
        </div>
        <div>
          {items.map((it, i) => (
            <div key={i} style={{ borderTop: `1px solid ${p.border}`, borderBottom: i === items.length - 1 ? `1px solid ${p.border}` : "none" }}>
              <button onClick={() => setOpen(open === i ? -1 : i)} style={{ width: "100%", background: "transparent", border: "none", padding: "22px 0", textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 20, fontFamily: p.display, fontSize: 20, fontWeight: isBrut ? 600 : 500, color: p.ink, letterSpacing: "-.01em" }}>
                <span>{it.q}</span>
                <span style={{ fontSize: 20, color: p.muted, transition: "transform .3s", transform: open === i ? "rotate(45deg)" : "rotate(0)" }}>+</span>
              </button>
              <div style={{ maxHeight: open === i ? 200 : 0, overflow: "hidden", transition: "max-height .35s ease,padding .25s", paddingBottom: open === i ? 22 : 0 }}>
                <div style={{ fontSize: 15, lineHeight: 1.7, color: p.body, fontFamily: p.body_font, maxWidth: 640 }}>{it.a}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function CTA({ p }) {
  const isBrut = p === VARIANTS.brutalist;
  return (
    <section className="reveal" style={{ padding: "96px 32px", background: p.ink, color: p.surface, position: "relative", overflow: "hidden" }}>
      <div style={{ maxWidth: 920, margin: "0 auto", textAlign: "center", position: "relative", zIndex: 2 }}>
        <h2 style={{ fontFamily: p.display, fontSize: "clamp(40px,5.5vw,72px)", fontWeight: isBrut ? 700 : 400, lineHeight: 1.02, letterSpacing: "-.025em", margin: "0 0 20px", textTransform: isBrut ? "uppercase" : "none" }}>
          Save four hours <i style={{ color: "#cbb88a", fontStyle: isBrut ? "normal" : "italic", fontWeight: isBrut ? 700 : 300 }}>this week.</i>
        </h2>
        <p style={{ fontSize: 17, color: "#cbb88a", margin: "0 0 36px", fontFamily: p.body_font, lineHeight: 1.6 }}>Seven days free. No card. Cancel anytime.</p>
        <a href="login.html" style={{ display: "inline-flex", alignItems: "center", gap: 10, background: p.surface, color: p.ink, padding: "16px 32px", borderRadius: isBrut ? 0 : 100, textDecoration: "none", fontWeight: 600, fontSize: 16, fontFamily: p.body_font, boxShadow: isBrut ? `6px 6px 0 ${p.accent}` : "none", border: isBrut ? `2px solid ${p.surface}` : "none" }}>Start free trial <span>→</span></a>
      </div>
    </section>
  );
}

function Footer({ p }) {
  return (
    <footer style={{ background: p.bg, color: p.body, padding: "48px 32px 32px", borderTop: `1px solid ${p.border}` }}>
      <div style={{ maxWidth: 1240, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 20 }}>
        <Logo p={p} />
        <div style={{ fontSize: 12, color: p.muted, fontFamily: p.body_font }}>© 2026 VakilDesk · Built for Indian advocates</div>
      </div>
      <div style={{ maxWidth: 1240, margin: "24px auto 0", fontFamily: p.mono, fontSize: 11, color: p.muted, letterSpacing: ".05em", lineHeight: 1.6, paddingTop: 18, borderTop: `1px solid ${p.border}` }}>
        ⚠ AI-generated analysis does not constitute legal advice. Always exercise independent professional judgment.
      </div>
    </footer>
  );
}

function NavBar({ p }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const isBrut = p === VARIANTS.brutalist;
  return (
    <nav style={{ position: "sticky", top: 0, zIndex: 50, background: scrolled ? p.surface + "ee" : "transparent", backdropFilter: scrolled ? "blur(10px)" : "none", borderBottom: scrolled ? `1px solid ${p.border}` : "1px solid transparent", padding: "16px 32px", transition: "all .25s", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <Logo p={p} size={28} />
      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        <a href="#how" style={{ padding: "8px 14px", color: p.body, textDecoration: "none", fontSize: 14, fontFamily: p.body_font, fontWeight: 500 }}>How it works</a>
        <a href="#pricing" style={{ padding: "8px 14px", color: p.body, textDecoration: "none", fontSize: 14, fontFamily: p.body_font, fontWeight: 500 }}>Pricing</a>
        <a href="login.html" style={{ padding: "9px 18px", background: p.ink, color: p.surface, borderRadius: isBrut ? 0 : 100, textDecoration: "none", fontSize: 14, fontFamily: p.body_font, fontWeight: 600, marginLeft: 8, border: isBrut ? `2px solid ${p.ink}` : "none" }}>Sign in</a>
      </div>
    </nav>
  );
}

function App() {
  const p = EDITORIAL;

  useEffect(() => {
    const obs = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), { threshold: .1 });
    document.querySelectorAll(".reveal").forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  return (
    <div style={{ background: p.bg, minHeight: "100vh", color: p.ink, fontFamily: p.body_font }}>
      <NavBar p={p} />
      <Hero p={p} showDemo={true} />
      <Marquee p={p} on={true} />
      <Stats p={p} />
      <Pillars p={p} />
      <Quote p={p} />
      <Pricing p={p} />
      <FAQ p={p} />
      <CTA p={p} />
      <Footer p={p} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
