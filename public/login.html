<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — VakilDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5efe2;
    --surface: #faf6ef;
    --ink: #1a1410;
    --body: #3d342c;
    --muted: #7a6b5d;
    --accent: #c1272d;
    --border: #e7ddc9;
    --display: 'Newsreader', serif;
    --body-font: 'DM Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--ink); color: var(--surface); }

  nav {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--ink); color: var(--surface);
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-family: var(--display); font-size: 18px; font-weight: 600; font-style: italic;
  }
  .logo-text {
    font-family: var(--display); font-size: 20px; font-weight: 500;
    letter-spacing: -.01em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 460px;
    padding: 44px 40px;
    box-shadow: 0 24px 60px rgba(26,20,16,.06);
  }
  .kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .kicker::before {
    content: ""; width: 24px; height: 1px; background: var(--ink);
  }
  h1 {
    font-family: var(--display);
    font-size: 38px; font-weight: 400;
    letter-spacing: -.02em;
    line-height: 1.05;
    margin: 0 0 12px;
    color: var(--ink);
  }
  h1 i { color: var(--muted); font-weight: 300; }
  .lede {
    font-family: var(--display);
    font-size: 16px; line-height: 1.55; color: var(--body);
    margin: 0 0 32px;
  }

  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .input-wrap { position: relative; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--body-font);
    font-size: 14.5px;
    color: var(--ink);
    transition: border-color .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--ink);
  }
  .toggle-pwd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; cursor: pointer;
    color: var(--muted); padding: 4px;
  }
  .toggle-pwd:hover { color: var(--ink); }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .row a {
    font-size: 12px; color: var(--accent); text-decoration: none;
    font-family: var(--body-font); font-weight: 500;
  }
  .row a:hover { text-decoration: underline; }

  .error {
    background: #fdecea;
    border: 1px solid #f5c6cb;
    color: #7a1f1f;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error.hidden { display: none; }

  button[type="submit"] {
    width: 100%;
    background: var(--ink); color: var(--surface);
    border: none; border-radius: 100px;
    padding: 13px 20px;
    font-family: var(--body-font); font-size: 15px; font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: transform .15s;
  }
  button[type="submit"]:hover:not(:disabled) {
    transform: translateY(-1px);
  }
  button[type="submit"]:disabled {
    opacity: .55; cursor: default;
  }

  .footer-link {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .footer-link a {
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .footer-link a:hover { text-decoration: underline; }

  .disclaimer {
    text-align: center;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .05em;
    padding: 16px;
  }
</style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <span class="logo-mark">V</span>
      <span class="logo-text">VakilDesk</span>
    </a>
  </nav>

  <main>
    <div class="card">
      <div class="kicker">Sign in</div>
      <h1>Welcome <i>back.</i></h1>
      <p class="lede">Pick up where you left off — your last review and any drafts in progress are waiting.</p>

      <form id="loginForm" novalidate>
        <div id="errorBanner" class="error hidden"></div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@firm.in" />
        </div>

        <div class="field">
          <div class="row">
            <label for="password" style="margin-bottom:0;">Password</label>
            <a href="#" tabindex="-1">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" />
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn">Sign in →</button>
      </form>

      <div class="footer-link">
        Don't have an account? <a href="/">Start a free trial</a>
      </div>
    </div>
  </main>

  <div class="disclaimer">⚠ AI-generated analysis does not constitute legal advice.</div>

<script>
  if (sessionStorage.getItem('vd_auth') === '1') {
    window.location.replace('dashboard.html');
  }

  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const banner = document.getElementById('errorBanner');
    const btn = document.getElementById('submitBtn');

    banner.classList.add('hidden');
    banner.textContent = '';

    if (!email || !password) {
      banner.textContent = 'Please enter your email and password.';
      banner.classList.remove('hidden');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      banner.textContent = 'Please enter a valid email address.';
      banner.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    // Placeholder auth — keep until a real /api/auth/login endpoint exists.
    setTimeout(function () {
      sessionStorage.setItem('vd_auth', '1');
      sessionStorage.setItem('vd_email', email);
      window.location.replace('dashboard.html');
    }, 700);
  });
</script>
</body>
</html>
